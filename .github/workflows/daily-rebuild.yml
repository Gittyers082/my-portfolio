name: daily rebuild

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel for a fresh build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK isn't set yet."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
